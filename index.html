<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Title, headings and every other word on the page are written by app.js
       from config.js. This file carries structure only. -->
  <title>Network</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      height: 100vh;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      background: #141414;
      color: #ccc;
    }

    /* ── Controls panel ── */
    #controls {
      width: 248px;
      flex-shrink: 0;
      background: #1c1c1c;
      border-right: 1px solid #2e2e2e;
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      gap: 15px;
      overflow-y: auto;
    }

    #controls h1 {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      color: #eee;
    }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-group > label {
      font-weight: 600;
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .radio-group { display: flex; flex-direction: column; gap: 5px; }
    .radio-group label {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 400; color: #bbb;
      text-transform: none; letter-spacing: 0;
      cursor: pointer;
    }

    .slider-row { display: flex; align-items: center; gap: 8px; }
    input[type=range] { flex: 1; cursor: pointer; accent-color: #4e79a7; min-width: 0; }
    .slider-val {
      font-variant-numeric: tabular-nums; white-space: nowrap;
      color: #999; font-size: 12px; min-width: 2.2em; text-align: right;
    }

    #play {
      border: 1px solid #3a3a3a; background: #252525; color: #ccc;
      border-radius: 4px; cursor: pointer; padding: 3px 9px;
      font: inherit; font-size: 12px; flex-shrink: 0;
    }
    #play:hover { background: #303030; color: #eee; }

    .hint { font-size: 11px; color: #7d7d7d; line-height: 1.5; }

    /* ── Search ── */
    #search {
      width: 100%; padding: 5px 8px; font: inherit; font-size: 12px;
      background: #252525; color: #ddd;
      border: 1px solid #3a3a3a; border-radius: 4px;
    }
    #search:focus { outline: none; border-color: #4e79a7; }
    #search::placeholder { color: #6f6f6f; }

    /* ── Selected node readout ── */
    #selected {
      background: #202020; border: 1px solid #313131; border-radius: 4px;
      padding: 8px 10px; line-height: 1.55;
    }
    #selected .sel-name { color: #eee; font-weight: 700; font-size: 13px; }
    #selected .sel-sub { color: #8a8a8a; font-size: 11px; }
    #selected .num { font-variant-numeric: tabular-nums; }

    /* ── Stats ── */
    #stats {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid #2e2e2e;
      font-size: 11px;
      color: #777;
      line-height: 1.8;
    }
    #stats strong { color: #aaa; font-variant-numeric: tabular-nums; }

    /* ── Legend ── */
    #legend { display: flex; flex-wrap: wrap; gap: 4px 10px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #aaa; }
    .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── Panels ── */
    #chart-container, #map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-width: 0;
    }
    #map-container { border-left: 1px solid #2e2e2e; }
    #chart, #map { width: 100%; height: 100%; display: block; }

    .panel-title {
      position: absolute; top: 10px; left: 12px;
      font-size: 11px; font-weight: 600; color: #777;
      text-transform: uppercase; letter-spacing: .05em;
      pointer-events: none;
    }
    .panel-sub {
      position: absolute; top: 26px; left: 12px;
      font-size: 11px; color: #6f6f6f;
      pointer-events: none; max-width: 60%;
    }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      display: none;
      background: rgba(0,0,0,.92);
      color: #eee;
      padding: 8px 11px;
      border-radius: 5px;
      font-size: 12px;
      line-height: 1.6;
      pointer-events: none;
      z-index: 10;
      max-width: 260px;
      border: 1px solid #333;
    }
    #tooltip strong { font-size: 13px; }
    #tooltip .num { font-variant-numeric: tabular-nums; }
    #tooltip .routes { color: #9a9a9a; font-size: 11px; }

    /* ── Loading / error overlay ── */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-size: 15px;
      color: #666;
      background: #141414;
      z-index: 5;
    }
    #loading code {
      background: #222; padding: 1px 5px; border-radius: 3px;
      font-size: 12px; color: #bbb;
    }

    hr { border: none; border-top: 1px solid #2e2e2e; }

    /* ── Credit ──
       At full width body is a row flex at 100vh, so a footer cannot be a flex
       child without becoming a third column -- it is pinned instead. The narrow
       layout below is a column, where it can simply sit at the end. */
    #credit {
      position: fixed; right: 0; top: 0; z-index: 50;
      padding: 4px 10px;
      font: 11px/1.35 system-ui, sans-serif;
      color: #8a8a8a; background: rgba(20,20,20,0.88);
      border-bottom-left-radius: 4px;
      pointer-events: none;
      max-width: 46%;
    }
    #credit a { color: #b9b9b9; pointer-events: auto; }
    #credit a:hover { color: #e8e8e8; }

    /* ── Narrow layout ──
       Two side-by-side force layouts do not survive a phone: below this width the
       panels were ~135px each and drew nothing readable. Stack instead. */
    @media (max-width: 900px) {
      body { flex-direction: column; height: auto; min-height: 100vh; }
      #controls {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #2e2e2e;
        overflow-y: visible;
      }
      #stats { margin-top: 12px; }
      #chart-container, #map-container {
        flex: none;
        width: 100%;
        height: 70vh;
        min-height: 380px;
      }
      #map-container { border-left: none; border-top: 1px solid #2e2e2e; }
      #credit {
        position: static; max-width: none; order: 99;
        background: none; padding: 10px 14px 14px;
        border-top: 1px solid #2e2e2e;
      }
    }
  </style>
</head>
<body>

<div id="controls">
  <h1 id="app-title"></h1>

  <div class="control-group" id="period-control">
    <label id="period-label"></label>
    <div class="slider-row">
      <button id="play" type="button" aria-label="Play through periods">▶</button>
      <div class="radio-group" id="period-group" style="flex:1"></div>
    </div>
  </div>

  <hr>

  <div class="control-group">
    <label id="node-picker-label"></label>
    <input type="text" id="search" autocomplete="off" list="node-list">
    <datalist id="node-list"></datalist>
    <div id="selected"></div>
  </div>

  <hr>

  <div class="control-group">
    <label id="metric-label"></label>
    <div class="radio-group">
      <label><input type="radio" name="metric" value="share" checked> <span id="metric-share-label"></span></label>
      <label><input type="radio" name="metric" value="count"> <span id="metric-count-label"></span></label>
    </div>
    <div class="hint" id="metric-hint"></div>
  </div>

  <hr>

  <div class="control-group">
    <label id="topn-label"></label>
    <div class="slider-row">
      <input type="range" id="topn-slider" min="5" max="50" step="1" value="25">
      <span class="slider-val" id="topn-val">25</span>
    </div>
    <div class="hint" id="topn-hint"></div>
  </div>

  <hr>

  <div class="control-group">
    <label>
      <input type="checkbox" id="second-order" checked style="accent-color:#4e79a7">
      <span id="second-order-label"></span>
    </label>
    <div class="hint">Adds edges among the destinations themselves, so the graph shows clusters rather than a bare star.</div>
  </div>

  <hr>

  <div class="control-group" id="group-control">
    <label id="group-label"></label>
    <div id="legend"></div>
  </div>

  <div id="stats">
    <div><span id="stat-edges-label"></span>: <strong id="stat-edges">—</strong></div>
    <div><span id="stat-coverage-label"></span>: <strong id="stat-coverage">—</strong></div>
    <div><span id="stat-total-label"></span>: <strong id="stat-total">—</strong></div>
  </div>
</div>

<div id="chart-container">
  <div id="loading">Loading…</div>
  <div class="panel-title" id="network-panel-title"></div>
  <div class="panel-sub" id="network-sub"></div>
  <svg id="chart"></svg>
</div>

<div id="map-container">
  <div class="panel-title" id="map-panel-title"></div>
  <div class="panel-sub" id="map-sub"></div>
  <svg id="map"></svg>
</div>

<div id="tooltip"></div>
<footer id="credit"></footer>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
